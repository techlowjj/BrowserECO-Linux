name: Build et tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Ubuntu ${{ matrix.os }} — Qt6
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Chaque entree associe explicitement sa version d'Ubuntu et la striccete
      # de la compilation. Un « include » avec une liste de valeurs poserait
      # matrix.strict = tableau : la matrice n'est alors plus expansee et
      # AUCUN job ne demarre (le run est « failure » avec 0 job).
      matrix:
        include:
          # Plancher Qt documente : 6.4 (Ubuntu 24.04). Ubuntu 22.04 embarque
          # Qt 6.2.4, en dessous du plancher : il ne sert plus a valider quoi
          # que ce soit et fait echouer le depot pour une cause hors code.
          - os: ubuntu-24.04
            strict: 'ON'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          # Qt 6.2 (22.04) a 6.4.2 (24.04) : le projet se construit sur les
          # deux, avec un garde #if QT_VERSION pour les rares API plus recentes.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-webengine-dev \
            desktop-file-utils \
            libqt6sql6-sqlite   # moteur SQLite : sans lui l'historique ne fonctionne pas

      - name: Configurer
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBROWSERECO_BUILD_TESTS=ON \
            -DBROWSERECO_WERROR=${{ matrix.strict && 'ON' || 'OFF' }}

      - name: Compiler
        run: cmake --build build --parallel

      - name: Listes de filtres
        run: Filters/update.sh

      - name: Tests (headless)
        id: tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          # Chromium ne peut pas ouvrir son bac a sable ni utiliser /dev/shm
          # sur un runner CI : sans ces options, QtWebEngine ne demarre pas.
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-dev-shm-usage --disable-gpu
        run: ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log

      # Les journaux de la CI necessitent une authentification pour etre lus par
      # l'API ; les ANNOTATIONS, non. On publie donc le nom des tests fautifs et
      # leurs messages d'echec : le diagnostic devient accessible, et le run
      # echoue quand meme.
      - name: Diagnostiquer les tests en echec
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Echec de la suite de tests (voir ci-dessous)"
          grep -E '^ *[0-9]+/[0-9]+ Test +#[0-9]+: .*\*\*\*' ctest.log | while IFS= read -r l; do
            echo "::error::${l}"
          done
          grep -E '^(FAIL!|QFATAL|ASSERT|Segmentation|Received signal|Totals)' ctest.log             | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
          tail -30 ctest.log

      - name: Valider le fichier .desktop
        run: |
          desktop-file-validate build/BrowserECO.desktop
          # StartupWMClass et WM_CLASS doivent concorder
          test "$(grep -oP 'StartupWMClass=\K.*' build/BrowserECO.desktop)" = "BrowserECO"

      - name: Tester le lancement (--version / --help)
        run: |
          QT_QPA_PLATFORM=offscreen ./build/BrowserECO --version
          QT_QPA_PLATFORM=offscreen ./build/BrowserECO --help

      - name: Paquet DEB (une seule fois)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y --no-install-recommends fakeroot
          # Layout .deb : binaire dans bin/, au lieu de la racine du prefixe
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DBROWSERECO_BUILD_TESTS=OFF -DBROWSERECO_DEB_LAYOUT=ON
          cmake --build build-deb --parallel
          cpack --config build-deb/CPackConfig.cmake -G DEB
          # UN SEUL paquet attendu. Avec un glob, un ancien .deb laisse dans le
          # depot fait matcher deux fichiers et dpkg-deb echoue de facon
          # incomprehensible (« tar killed by signal ») — c'est exactement ce qui
          # faisait echouer cette etape sur d5be541 (bump 1.3.0 -> 1.4.0 avec
          # le vieux paquet encore versionne). On compte, et on dit quoi.
          mapfile -t paquets < <(ls -1 browser-eco_*.deb 2>/dev/null || true)
          if [ "${#paquets[@]}" -ne 1 ]; then
            echo "::error::Attendu exactement 1 paquet .deb, trouve ${#paquets[@]} : ${paquets[*]:-(aucun)}"
            exit 1
          fi
          dpkg-deb -c "${paquets[0]}" | grep -q "usr/bin/BrowserECO"
          dpkg-deb --fsys-tarfile "${paquets[0]}" | tar -xO ./usr/share/applications/BrowserECO.desktop \
            | grep -q '^Exec=/usr/bin/BrowserECO'
          echo "Paquet .deb OK : ${paquets[0]}"

  clazy:
    name: Clazy static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Clazy et Qt
        run: |
          sudo apt-get update
          # Les dependances Qt sont INDISPENSABLES ici aussi : sans elles,
          # find_package(Qt6) echoue a la configuration. C'est ce qui faisait
          # echouer ce job (vu sur 9089654).
          sudo apt-get install -y --no-install-recommends \
            clazy cmake g++ qt6-base-dev qt6-webengine-dev

      - name: Configurer
        run: |
          cmake -S . -B build-clazy -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clazy

      # Le build Clazy s'arrête au LIEN (Clazy pilote clang, pas le lien), mais
      # tous les warnings sont émis pendant la compilation. On ignore donc
      # l'échec de lien et on ne regarde que les warnings : on est à 0, tout
      # nouveau warning est une régression.
      - name: Analyser
        run: |
          cmake --build build-clazy --parallel 2>&1 | tee clazy.log || true
          if grep -q "warning:" clazy.log; then
            echo "::error::Clazy a détecté des warnings"
            grep "warning:" clazy.log
            exit 1
          fi
          echo "Clazy : 0 warning"
